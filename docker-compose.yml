version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: interaktiff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interaktiff
      POSTGRES_PASSWORD: interaktiff_password
      POSTGRES_DB: interaktiff
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interaktiff"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO (S3-compatible storage)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: interaktiff-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: interaktiff-videos
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ============================================
  # Redis (for caching and sessions)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: interaktiff-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interaktiff-app
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://interaktiff:interaktiff_password@postgres:5432/interaktiff

      # NextAuth
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production-random-key}

      # App
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: interaktiff

      # Storage (MinIO)
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: interaktiff-videos
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000

      # Optional: Mux (comment out if not using)
      # MUX_TOKEN_ID: ${MUX_TOKEN_ID}
      # MUX_SECRET_KEY: ${MUX_SECRET_KEY}
      # MUX_WEBHOOK_SIGNING_SECRET: ${MUX_WEBHOOK_SIGNING_SECRET}

      # Node
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/public/uploads

  # ============================================
  # PgAdmin (Database management - optional)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: interaktiff-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@interaktiff.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE_NAME: interaktiff
      PGADMIN_CONFIG_SERVER_CONNECTION_HOSTNAME: postgres
      PGADMIN_CONFIG_SERVER_CONNECTION_PORT: 5432
      PGADMIN_CONFIG_SERVER_CONNECTION_DATABASE: interaktiff
      PGADMIN_CONFIG_SERVER_CONNECTION_USERNAME: interaktiff
      PGADMIN_CONFIG_SERVER_CONNECTION_PASSWORD: interaktiff_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

networks:
  default:
    name: interaktiff-network
